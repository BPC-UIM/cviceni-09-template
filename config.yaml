                            # ale skryty prostor zustane spojity (body se neslijou do rohu)

triangle:
  vertices: [[0.5, 0.2], [0.1, 0.6], [0.9, 0.6]]   # vrcholy trojuhelniku (x1, x2) -- faze trojuhelnik
